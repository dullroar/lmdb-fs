[project]
name = "lmdb-fs"
version = "0.1.0"
description = "A read-only faceted semantic filesystem backed by LMDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lmdb>=2.3.0",
    "pyfuse3>=3.5.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
]

[project.scripts]
semanticfs = "semanticfs.cli:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semanticfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a visible /dev/fuse and performs a temporary mount",
]
